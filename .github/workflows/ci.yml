name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS universal build + tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Verify factory bank
        run: python3 scripts/generate-presets.py --check
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify universal slices and deployment target
        run: |
          bundle="build/ReverseLab_artefacts/Release/VST3/ReverseLab.vst3"
          bin="$bundle/Contents/MacOS/ReverseLab"
          lipo -archs "$bin" | tee /dev/stderr | grep -q "arm64"
          lipo -archs "$bin" | grep -q "x86_64"
          for arch in arm64 x86_64; do
            vtool -arch "$arch" -show-build "$bin" | grep -E 'minos +11\.0$'
          done
          codesign --verify --deep --strict "$bundle"
      - name: Package and validate downloadable bundle
        run: |
          bundle="build/ReverseLab_artefacts/Release/VST3/ReverseLab.vst3"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" ReverseLab-VST3.zip
          mkdir -p build/artifact-roundtrip
          ditto -x -k ReverseLab-VST3.zip build/artifact-roundtrip
          restored="build/artifact-roundtrip/ReverseLab.vst3"
          test -x "$restored/Contents/MacOS/ReverseLab"
          codesign --verify --deep --strict "$restored"
          build/ReverseLabHostTests_artefacts/Release/ReverseLabHostTests "$restored"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReverseLab-VST3-${{ github.sha }}
          path: ReverseLab-VST3.zip

  linux-tests:
    name: Linux DSP/processor tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev \
            xvfb xauth openbox x11-utils
      - name: Verify factory bank
        run: python3 scripts/generate-presets.py --check
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: |
          xvfb-run -a bash -eu -o pipefail <<'BASH'
          # JUCE caches WM_PROTOCOLS at startup, so the window manager must be ready
          # on this same display before any CTest executable creates its desktop.
          openbox --sm-disable >build/openbox.log 2>&1 &
          wm_pid=$!
          cleanup() {
            kill "$wm_pid" 2>/dev/null || true
            wait "$wm_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          wm_ready=false
          wm_ready_deadline=$((SECONDS + 10))
          while (( SECONDS < wm_ready_deadline )); do
            if ! kill -0 "$wm_pid" 2>/dev/null; then
              printf '%s\n' 'Openbox exited before the test desktop became ready.' >&2
              sed -n '1,$p' build/openbox.log >&2
              exit 1
            fi
            if timeout 1 xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null \
                 | grep -Eq 'window id # 0x[0-9a-fA-F]*[1-9a-fA-F][0-9a-fA-F]*$' \
               && timeout 1 xlsatoms -name WM_PROTOCOLS 2>/dev/null \
                 | grep -Eq '^[[:space:]]*[1-9][0-9]*[[:space:]]+WM_PROTOCOLS$'; then
              wm_ready=true
              break
            fi
            sleep 0.1
          done
          if ! "$wm_ready"; then
            printf '%s\n' 'Timed out waiting for Openbox and WM_PROTOCOLS on the test display.' >&2
            sed -n '1,$p' build/openbox.log >&2
            exit 1
          fi
          printf '[test-desktop] Openbox and WM_PROTOCOLS ready on %s\n' "$DISPLAY"
          ctest --test-dir build --output-on-failure
          BASH

  sanitizers:
    name: ASan + UBSan
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Verify factory bank
        run: python3 scripts/generate-presets.py --check
      - name: Configure
        run: >
          cmake -S . -B build-asan -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build tests
        run: cmake --build build-asan -j "$(sysctl -n hw.ncpu)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
      - name: Verify Makefiles bundle and ZIP roundtrip
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          bundle="build-asan/ReverseLab_artefacts/RelWithDebInfo/VST3/ReverseLab.vst3"
          codesign --verify --deep --strict "$bundle"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" build-asan/ReverseLab-VST3.zip
          mkdir -p build-asan/artifact-roundtrip
          ditto -x -k build-asan/ReverseLab-VST3.zip build-asan/artifact-roundtrip
          codesign --verify --deep --strict build-asan/artifact-roundtrip/ReverseLab.vst3
          build-asan/ReverseLabHostTests_artefacts/RelWithDebInfo/ReverseLabHostTests build-asan/artifact-roundtrip/ReverseLab.vst3
